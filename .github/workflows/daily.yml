name: Daily A-share cloud report

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "config/**"
      - "pyproject.toml"
      - ".github/workflows/daily.yml"
  schedule:
    - cron: "30 8 * * 1-5"

permissions:
  contents: write

concurrency:
  group: daily-a-share-report
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Test
        run: pytest

      - name: Build verified HTTPS report
        env:
          TZ: Asia/Shanghai
        run: python -m ashare_picker.cloud_pipeline --config config/default.yml --as-of "$(date +%F)"

      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        with:
          name: a-share-report
          path: reports/latest
          retention-days: 30

      - name: Commit generated report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/latest
          if git diff --cached --quiet; then
            echo "No report changes"
          else
            git commit -m "data: refresh daily A-share cloud report"
            git push
          fi
